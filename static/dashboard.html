<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultra RAG Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d7dde5;
      --accent: #0f766e;
      --warn: #b45309;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    main { padding: 20px 24px 32px; max-width: 1280px; margin: 0 auto; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 14px; min-height: 82px; }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .value { margin-top: 8px; font-size: 26px; font-weight: 720; }
    .panel { overflow: hidden; }
    .panel h2 { margin: 0; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    td { overflow-wrap: anywhere; }
    .status-ok { color: var(--accent); font-weight: 700; }
    .status-warn { color: var(--warn); font-weight: 700; }
    .status-bad { color: var(--bad); font-weight: 700; }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ultra RAG Dashboard</h1>
    <div class="toolbar">
      <input id="collection" value="default" aria-label="Collection">
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <section class="grid">
      <div class="metric"><div class="label">Health</div><div class="value" id="health">...</div></div>
      <div class="metric"><div class="label">Queries</div><div class="value" id="queries">0</div></div>
      <div class="metric"><div class="label">Avg Latency</div><div class="value" id="latency">0 ms</div></div>
      <div class="metric"><div class="label">Avg Quality</div><div class="value" id="quality">0</div></div>
    </section>
    <section class="panel">
      <h2>Recent Queries</h2>
      <table>
        <thead>
          <tr>
            <th style="width: 34%">Query</th>
            <th>Strategy</th>
            <th>Quality</th>
            <th>Latency</th>
            <th>Results</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recent"></tbody>
      </table>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    async function load() {
      const collection = encodeURIComponent(byId("collection").value || "default");
      const health = await fetch("/api/health").then(r => r.json()).catch(() => ({status: "error"}));
      const summary = await fetch(`/api/observability/summary?collection=${collection}`).then(r => r.json()).catch(() => null);
      byId("health").textContent = health.status || "error";
      byId("health").className = health.status === "ok" ? "value status-ok" : "value status-warn";
      if (!summary) return;
      byId("queries").textContent = summary.count;
      byId("latency").textContent = `${summary.avg_latency_ms} ms`;
      byId("quality").textContent = summary.avg_quality_score;
      byId("recent").innerHTML = summary.recent.map(row => `
        <tr>
          <td>${escapeHtml(row.query_text || "")}</td>
          <td>${escapeHtml(row.strategy || "")}</td>
          <td>${row.quality_score ?? ""}</td>
          <td>${row.latency_ms ?? ""} ms</td>
          <td>${row.result_count ?? ""}</td>
          <td>${escapeHtml(row.corrective_action || "")}</td>
        </tr>`).join("");
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    byId("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
