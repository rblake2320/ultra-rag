[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-rag"
version = "0.2.0"
description = "Hybrid retrieval-augmented generation pipeline with pgvector, knowledge graph retrieval, reranking, and evaluation utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "chardet>=5.0.0",
    "tiktoken>=0.7.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "starlette>=0.40.0,<0.42.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ultrarag-ingest = "ingest:main"
ultrarag-query = "query:main"
ultrarag-ultra-ingest = "ultra_ingest:main"
ultrarag-ultra-query = "ultra_query:main"
ultrarag-eval = "ultra_eval:main"
ultrarag-server = "ultra_server:main"
ultrarag-code-graph = "ultra_code_graph:main"
ultrarag-retrieval-eval = "ultra_retrieval_eval:main"
ultrarag-check = "ultra_check:main"
ultrarag-benchmark = "ultra_benchmark:main"
ultrarag-playbooks = "ultra_playbooks:main"
ultrarag-product-smoke = "ultra_product_smoke:main"
ultrarag-arch-audit = "ultra_arch_audit:main"
ultrarag-agent-run = "ultra_agent_run:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["ingest", "query", "ultra_ingest", "ultra_query", "ultra_eval", "ultra_server", "ultra_code_graph", "ultra_retrieval_eval", "ultra_check", "ultra_benchmark", "ultra_playbooks", "ultra_product_smoke", "ultra_arch_audit", "ultra_agent_run"]
